name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's "packageManager" field — the
      # action errors if both that and an explicit `version` are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Offline pipeline smoke test
        run: pnpm demo

      - name: Build portal
        run: pnpm --filter @tars/portal run build
